[package]
name = "ipping-node"
version = "0.7.1"
edition = "2024"
rust-version = "1.88"
description = "Measurement node for ipping: runs bounded network probes on behalf of the backend"
license = "MIT"
repository = "https://github.com/ip-ping/ipping-node"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
h2 = "0.4"
http = "1"
httparse = "1.10"
rand = "0.10.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6.5"
surge-ping = "0.9.1"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
webpki-roots = "1"
x509-parser = "0.18"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
bytes = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["test-util"] }
