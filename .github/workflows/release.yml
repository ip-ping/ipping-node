name: Release

# Cut a release in either of two ways; both take the same path:
#   git tag v0.1.0 && git push origin v0.1.0
#   gh workflow run release.yml -f version=0.1.0 -f dry_run=false      (or the Actions tab)
# A dry run builds and checks everything and publishes nothing. See RELEASING.md in the ipping
# repository for the order and rules.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (0.1.0, or 0.2.0-rc.1 for a preview)"
        required: true
        type: string
      dry_run:
        description: "Build and check everything, publish nothing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          if [ "$EVENT" = push ]; then
            tag="$GITHUB_REF_NAME"; publish=true
          else
            tag="v${INPUT_VERSION#v}"
            if [ "$INPUT_DRY_RUN" = true ]; then publish=false; else publish=true; fi
            if [ "$publish" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are cut from main; this run is on $GITHUB_REF."; exit 1
            fi
          fi
          version="${tag#v}"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::'$tag' is not a version like v1.2.3 or v1.2.3-rc.1"; exit 1; }
          file="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          [ "${version%%-*}" = "$file" ] \
            || { echo "::error::$tag does not match the version in Cargo.toml ($file). Bump it (and Cargo.lock) and merge first."; exit 1; }
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "tag=$tag"; echo "version=$version"; echo "minor=${version%.*}"
            echo "prerelease=$prerelease"; echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (prerelease: $prerelease, publish: $publish)" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: Checks
    needs: prepare
    uses: ./.github/workflows/ci.yml

  image:
    name: Versioned image
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          # `latest` is owned by docker.yml (it tracks main); a release adds 1.2.3 and, for stable
          # releases, 1.2.
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/ipping-node:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.prerelease == 'false' && format('{0}/ipping-node:{1}', vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME, needs.prepare.outputs.minor) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Release binaries
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build both architectures from the same Dockerfile as the image
        run: |
          set -eu
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --target binary \
              --output "type=local,dest=out/$arch" .
            cp "out/$arch/ipping-node" "ipping-node-linux-$arch"
          done
          ls -l ipping-node-linux-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: ipping-node-linux-*

  release:
    name: GitHub release
    needs: [prepare, image, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
      - name: Checksums
        run: |
          set -eu
          cp ipping-node.sh .
          sha256sum -- ipping-node-linux-* ipping-node.sh > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        if: needs.prepare.outputs.publish == 'true'
        run: |
          set -eu
          files=(ipping-node-linux-* SHA256SUMS ipping-node.sh)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            args=(--generate-notes --target "$GITHUB_SHA")
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); else args+=(--latest); fi
            gh release create "$TAG" "${files[@]}" "${args[@]}"
          fi
