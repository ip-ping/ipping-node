name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  # Reused by docker.yml and release.yml so a publish never skips the checks.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Format, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Lint the installer script
        run: shellcheck ipping-node.sh tests/installer.sh
      - name: Installer tests
        run: bash tests/installer.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  traceroute:
    name: Traceroute through real routers (network namespaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Lint the test script
        run: shellcheck tests/netns/traceroute.sh
      - name: Build the test as the normal user
        run: |
          bin="$(cargo test --test traceroute_live --no-run --locked --message-format=json \
            | grep -o '"executable":"[^"]*traceroute_live[^"]*"' | head -1 | cut -d'"' -f4)"
          echo "TRACEROUTE_TEST_BIN=$bin" >> "$GITHUB_ENV"
      - name: Three routers, IPv4 and IPv6
        run: sudo env "TRACEROUTE_TEST_BIN=$TRACEROUTE_TEST_BIN" tests/netns/traceroute.sh

  ipv6:
    name: IPv6 with global addresses (network namespaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Lint the test script
        run: shellcheck tests/netns/ipv6.sh
      - name: Build the test as the normal user
        run: |
          bin="$(cargo test --test ipv6_live --no-run --locked --message-format=json \
            | grep -o '"executable":"[^"]*ipv6_live[^"]*"' | head -1 | cut -d'"' -f4)"
          echo "IPV6_TEST_BIN=$bin" >> "$GITHUB_ENV"
      - name: Every kind over IPv6 through a router
        run: sudo env "IPV6_TEST_BIN=$IPV6_TEST_BIN" tests/netns/ipv6.sh

  image:
    name: Container image builds for both architectures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
