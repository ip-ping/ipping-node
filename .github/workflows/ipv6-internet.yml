name: IPv6 internet

# Run by hand. The ordinary tests build IPv6 out of network namespaces; this is for a machine that has a real IPv6
# route, to see the node work over the public IPv6 internet.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reach:
    name: Does this runner reach the IPv6 internet?
    runs-on: ubuntu-latest
    steps:
      - name: Addresses, routes and a request
        run: |
          ip -6 addr show scope global || true
          ip -6 route show || true
          curl -6 -sS -m 10 -o /dev/null -w 'ipv6.google.com: HTTP %{http_code} from %{remote_ip}\n' https://ipv6.google.com || echo "no IPv6 route to the internet from this runner"
